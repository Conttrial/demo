<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>黄健 — 安全管理平台 — 演示</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <style>
      /* 首屏 loading — 在 Vue 启动前立即显示 */
      #app-loading {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #0f1419;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity .4s ease;
      }
      #app-loading.fade-out { opacity: 0; pointer-events: none; }
      .loading-shield { font-size: 48px; animation: pulse 1.2s ease-in-out infinite; }
      .loading-text { color: #6b7280; font-size: 14px; margin-top: 12px; letter-spacing: 1px; }
      .loading-bar-wrap { width: 160px; height: 3px; background: #1f2937; border-radius: 2px; margin-top: 16px; overflow: hidden; }
      .loading-bar { height: 100%; width: 30%; background: linear-gradient(90deg, #4f6ef7, #818cf8); border-radius: 2px; animation: loadSlide 1.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: .7; } }
      @keyframes loadSlide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
    </style>
    <script type="module" crossorigin src="assets/index-BJIRM3Aj.js"></script>
    <link rel="stylesheet" crossorigin href="assets/index-Dkgaaofb.css">
  </head>
  <body>
    <div id="app-loading">
      <div class="loading-shield">🛡️</div>
      <div class="loading-text">SafeGuard 加载中...</div>
      <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
    </div>
    <div id="app"></div>
  </body>
</html>
